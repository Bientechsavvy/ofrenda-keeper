services:
  - type: web
    name: ofrenda-keeper
    runtime: python
    plan: free
    buildCommand: "echo no build step"
    startCommand: "python api/server.py"
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "1"           # public demo: only the built-in FAKE chats are accepted
      - key: LLM_BACKEND
        value: backboard
      - key: BACKBOARD_API_KEY
        sync: false          # set the secret in the Render dashboard, never in git
      - key: BACKBOARD_PROVIDER
        value: openrouter
      - key: BACKBOARD_MODEL
        value: moonshotai/kimi-k2.6
      - key: MODEL_MAX_PER_HOUR
        value: "60"
